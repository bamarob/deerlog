<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeerLog - Hunt Map</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 20px;
        }
        .map-container {
            border: 2px solid #2c3e50;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>My Hunting Map Dashboard</h1>
            <p>Showing past hunt sessions and verified harvest locations.</p>
        </div>
        
        <div class="map-container">
            <!-- This safe filter injects the interactive Folium map engine directly -->
            {{ map_html|safe }}
        </div>
    </div>
</body>
</html>
