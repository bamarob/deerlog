{% extends "admin/change_form.html" %}

{% block after_field_sets %}
    <hr>
    <h3>Click the Map to Set Location</h3>
    <p style="color: #666; font-size: 0.9em;">Clicking anywhere on this map will automatically update the Latitude and Longitude fields below.</p>
    
    <div style="margin-bottom: 20px; border: 2px solid #ccc; border-radius: 4px; overflow: hidden;">
        <!-- Inject our custom map wrapper -->
        {{ admin_map_html|safe }}
    </div>

    <!-- JavaScript to catch Folium clicks and inject them into Django's native inputs -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Wait for the map to finish initializing
            setTimeout(function() {
                // Find the Leaflet map instance generated by Folium
                // Folium maps expose themselves via window variables or global leaflet objects
                if (typeof L !== 'undefined' && typeof map_block !== 'undefined') {
                    map_block.on('click', function(e) {
                        var lat = e.latlng.lat.toFixed(6);
                        var lng = e.latlng.lng.toFixed(6);
                        
                        // Inject the clicked values directly into Django Admin's input fields
                        document.getElementById('id_latitude').value = lat;
                        document.getElementById('id_longitude').value = lng;
                    });
                }
            }, 500); // Give the browser a half second to build the map element
        </script>
{% endblock %}
